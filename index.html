<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdul Hidayatullah | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,700;1,800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #050505; color: white; scroll-behavior: smooth; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .text-gradient { background: linear-gradient(to right, #fff, #555); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>
    <nav class="fixed top-0 w-full z-50 glass py-5 px-6 flex justify-between items-center">
        <div class="font-bold text-xl tracking-tighter italic">ABDUL.</div>
        <div class="flex gap-6 text-[10px] uppercase tracking-[0.3em] opacity-40">
            <a href="#about" class="hover:opacity-100 transition">Tentang</a>
            <a href="#contact" class="hover:opacity-100 transition">Kontak</a>
        </div>
    </nav>

    <section class="min-h-screen flex flex-col justify-center px-6 max-w-5xl mx-auto pt-20">
        <div data-aos="fade-up" data-aos-duration="1000">
            <h1 class="text-7xl md:text-9xl font-black tracking-tighter italic leading-[0.85] mb-8 text-gradient">
                DESIGNER <br> & DEVELOPER.
            </h1>
            <p class="max-w-md opacity-40 text-lg leading-relaxed font-light">
                Berdosili di Cikampek. Fokus pada pembuatan website interaktif menggunakan Acode dan GitHub.
            </p>
            <div class="mt-10 flex gap-4">
                <a href="#contact" class="px-8 py-4 bg-white text-black font-bold uppercase tracking-widest text-[10px] rounded-full hover:scale-105 transition">Mari Bicara</a>
            </div>
        </div>
    </section>

    <section id="about" class="py-32 px-6 max-w-5xl mx-auto border-t border-neutral-900">
        <h2 class="text-sm uppercase tracking-[0.5em] text-neutral-600 mb-12">Main Tech Stack</h2>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-4" data-aos="fade-up">
            <div class="p-8 glass rounded-3xl hover:bg-white/5 transition">
                <p class="font-bold tracking-tighter">Next.js & React</p>
            </div>
            <div class="p-8 glass rounded-3xl hover:bg-white/5 transition">
                <p class="font-bold tracking-tighter">Tailwind CSS</p>
            </div>
            <div class="p-8 glass rounded-3xl hover:bg-white/5 transition">
                <p class="font-bold tracking-tighter">Mobile Coding</p>
            </div>
        </div>
    </section>

    <footer id="contact" class="py-32 px-6 max-w-5xl mx-auto border-t border-neutral-900">
        <div class="text-center">
            <h2 class="text-4xl md:text-6xl font-bold tracking-tighter italic mb-8">Punya ide hebat?</h2>
            <a href="https://wa.me/628123456789" class="text-2xl underline decoration-neutral-700 underline-offset-8 hover:text-neutral-400 transition italic">Hubungi via WhatsApp</a>
        </div>
        <p class="mt-40 text-center text-[10px] uppercase tracking-[0.5em] opacity-20">&copy; 2026 Abdul Hidayatullah.</p>
    </footer>

    <script> AOS.init({ once: true }); </script>
</body>
</html>
